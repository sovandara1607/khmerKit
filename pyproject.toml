[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khmerkit"
version = "0.1.1"
description = "Open-source Khmer text normalization, document search, and evaluation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "KhmerKit contributors" }]
dependencies = [
  "pheasa>=0.1,<0.2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
khmerkit-benchmark = "khmerkit.cli:main"
khmerkit-validate-provenance = "khmerkit.provenance:main"
khmerkit-search = "khmerkit.search_cli:main"
khmerkit-quality-smoke = "khmerkit.quality_smoke:main"
khmerkit-api = "khmerkit.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
